name: ci

on:
  push:
  pull_request:

# 3 OS で ctest（差分テスト diff_tests_pl と diff_conformance を含む）、準拠スイート、mosac toolchain、mosac build を流す。
# 差分テストは -LE diff / -L diff の 2 段に分け、全テストを 1 回ずつ流しつつ、一致率の行をログに出す（-V）。
# 生成コードは diff_test.cmake と MOSA_WERROR=1 で警告を誤りにしてコンパイルする（「生成した C++ は常にコンパイルできる」）。
# 持ち主の決定 3: mosac build した hello を成果物に上げ、別のジョブで落として動かす（ADR 0009 Review Focus 5）。
# macOS では bench/ の 6 本を流し、比が docs/bench.json より 20% 以上下がれば警告にする（失敗にはしない、計画 Task 13）。
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset macos-clang
      - name: Build
        run: cmake --build --preset macos-clang
      - name: Toolchain
        run: ./build/mosac toolchain
      - name: Test
        run: ctest --preset macos-clang -LE diff
      - name: Differential tests
        run: ctest --preset macos-clang -L diff -V --no-tests=error
      - name: Conformance suite
        run: ./build/mosatest --suite tests/conformance
      - name: Build standalone hello
        env:
          MOSA_WERROR: 1
        run: ./build/mosac build tests/mosac/hello.pl -o hello --cxx clang++
      - uses: actions/upload-artifact@v4
        with:
          name: hello-macos
          path: hello
          if-no-files-found: error
      - name: Write summary
        shell: bash
        run: |
          grep -m 1 '^合格率:' docs/conformance.md >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/.*"message":"\([^"]*\)".*/mosatest --diff: \1/p' docs/agreement.json | head -n 1 >> "$GITHUB_STEP_SUMMARY"
      # README のバッジは main の conformance.json と agreement.json を読む。照合を macOS だけにするのは、開発者が
      # 生成してコミットする環境に合わせ、OS ごとの差でバッジの値が揺れないようにするため。
      - name: Check badges
        shell: bash
        run: git diff --exit-code -- docs/conformance.json docs/agreement.json
      # 計画 Task 13。bench/ の 6 本を docs/bench.json と同じ N で測り、プログラムごとの比（インタプリタ / 翻訳）が
      # コミット済みの比より 20% 以上下がれば警告にする。ランナーは表を測った機械（docs/bench.md）と違い、ミリ秒の
      # 絶対値どうしを比べると毎回 22-78% 遅いと出た（最終レビュー）。比は両側が同じ機械で測るので機械の速さが消える。
      # docs/bench.json は 1 行 1 プログラムなので、値は行から sed で抜く。比は小数 1 桁なので、awk で 10 倍の整数にして比べる。Actions の bash は
      # -e と pipefail で動くので set +e で外し、測れなかったプログラムや比べられない値も警告にして次へ進む。
      - name: Benchmarks
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          now=tests/tmp/bench-ci.json
          rm -f "$now"
          field() { sed -n "s/.*\"$1\":\([^,}]*\).*/\1/p"; }
          positive() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+(\.[0-9]+)?$/ && v + 0 > 0) }'; }
          {
            echo "### Benchmarks (macOS runner vs committed docs/bench.json; ratio = interpreter / translated)"
            echo ""
            echo "| Program | N | Interpreter ms | Translated ms | Ratio | Committed ratio | Note |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^  {"file":' docs/bench.json | while IFS= read -r base; do
            file=$(printf '%s\n' "$base" | sed -n 's/.*"file":"\([^"]*\)".*/\1/p')
            count=$(printf '%s\n' "$base" | field count)
            if ! LANG=C ./build/mosatest --bench "$file" --count "$count" --work tests/tmp/bench-ci --report "$now" < /dev/null; then
              echo "::warning title=Benchmark::$file: mosatest --bench failed"
              echo "| $file | $count | | | | | mosatest --bench failed |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            got=$(grep -F "{\"file\":\"$file\"," "$now")
            old=$(printf '%s\n' "$base" | field ratio)
            new=$(printf '%s\n' "$got" | field ratio)
            note=""
            if ! positive "$old" || ! positive "$new"; then
              echo "::warning title=Benchmark::$file: comparison skipped (measured ratio '${new}', committed ratio '${old}')"
              note=" comparison skipped;"
            elif awk -v new="$new" -v old="$old" 'BEGIN { exit !(int(new * 10 + 0.5) * 100 <= int(old * 10 + 0.5) * 80) }'; then
              drop=$(awk -v new="$new" -v old="$old" 'BEGIN { printf "%d", (old - new) * 100 / old }')
              echo "::warning title=Benchmark::$file: ratio ${new} is ${drop}% below docs/bench.json (${old})"
              note=" ratio ${drop}% lower;"
            fi
            row="| $file | $count | $(printf '%s\n' "$got" | field interpreter_ms) | $(printf '%s\n' "$got" | field translated_ms)"
            echo "$row | $new | $old |$note |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

  linux-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build cmake
      # 遅いテスト（mosac build --runtime-source が同梱の源から libmosa を作る）はこのジョブだけで流す。
      - name: Configure
        run: cmake --preset linux-gcc -DMOSA_SLOW_TESTS=ON
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Toolchain
        run: ./build/mosac toolchain
      - name: Test
        run: ctest --preset linux-gcc -LE diff
      - name: Differential tests
        run: ctest --preset linux-gcc -L diff -V --no-tests=error
      - name: Conformance suite
        run: ./build/mosatest --suite tests/conformance
      - name: Build standalone hello
        env:
          MOSA_WERROR: 1
        run: ./build/mosac build tests/mosac/hello.pl -o hello --cxx g++
      - uses: actions/upload-artifact@v4
        with:
          name: hello-linux-gcc
          path: hello
          if-no-files-found: error
      - name: Write summary
        shell: bash
        run: |
          grep -m 1 '^合格率:' docs/conformance.md >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/.*"message":"\([^"]*\)".*/mosatest --diff: \1/p' docs/agreement.json | head -n 1 >> "$GITHUB_STEP_SUMMARY"

  # 取りこぼした GC の根を落ちとして見つけるジョブ（ADR 0010、計画 Task 6）。MOSA_GC_STRESS=N は N 回の安全点ごとに GC を走らせる。
  # 手元（macOS、10 コア）で N=1 の ctest（差分テスト diff_tests_pl と diff_conformance を含む、mosatest --diff を内部で流す）が
  # 309 秒だったので、N は 1 のまま（40 分を超えたら 7 に上げる）。ヒープに何百万語も載せる gc、heap_growth、mosac_heap_limit は
  # N=1 では設計上遅いので、1 段目から外し、2 段目で N=1000 にして流す（手元で 401 秒）。install と bench は GC と関わらないので外す。
  # 深さ 100 万の項を作って書く stack_deep_write と stack_deep_builtins（ADR 0011）は、GC ごとに項全体をなめるので N=1000 でも
  # 深さの 2 乗で 600 秒を超える（手元で深さ 10 万の print/1 が 2.3 秒、20 万で 9.0 秒）。どちらも C++ のスタックの深さを見るテストで、
  # writer の途中の GC は print.pl の print_portray_gc が N=1 で見るので、このジョブでは流さない。long_literal、mosac_long_list、
  # 深さ 100 万の答えを書く machine_deep（手元で N=1 は 900 秒超、N=1000 は 57 秒）は 2 段目に置く。
  linux-gc-stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build cmake
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Tests and differential tests with MOSA_GC_STRESS=1
        env:
          MOSA_GC_STRESS: 1
        run: ctest --preset linux-gcc -E "^(gc|heap_growth|mosac_heap_limit|long_literal|mosac_long_list|machine_deep|stack_deep_write|stack_deep_builtins)$|install|bench" --no-tests=error
      - name: Heavy GC tests with MOSA_GC_STRESS=1000
        env:
          MOSA_GC_STRESS: 1000
        run: ctest --preset linux-gcc -R "^(gc|heap_growth|mosac_heap_limit|long_literal|mosac_long_list|machine_deep)$" --no-tests=error

  linux-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake
      - name: Configure
        run: cmake --preset linux-clang
      - name: Build
        run: cmake --build --preset linux-clang
      - name: Toolchain
        run: ./build/mosac toolchain
      - name: Test
        run: ctest --preset linux-clang -LE diff
      - name: Differential tests
        run: ctest --preset linux-clang -L diff -V --no-tests=error
      - name: Conformance suite
        run: ./build/mosatest --suite tests/conformance
      - name: Build standalone hello
        env:
          MOSA_WERROR: 1
        run: ./build/mosac build tests/mosac/hello.pl -o hello --cxx clang++
      - uses: actions/upload-artifact@v4
        with:
          name: hello-linux-clang
          path: hello
          if-no-files-found: error
      - name: Write summary
        shell: bash
        run: |
          grep -m 1 '^合格率:' docs/conformance.md >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/.*"message":"\([^"]*\)".*/mosatest --diff: \1/p' docs/agreement.json | head -n 1 >> "$GITHUB_STEP_SUMMARY"

  windows:
    # windows-latest は 2026-06 以降 Visual Studio 2026 である。SPEC 第2節の MSVC 2022 と Visual Studio 17 2022 ジェネレータがある windows-2022 を使う。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      # 既定の探索（vswhere → vcvarsall）を通す。mosac build もその環境で cl.exe と NMake を使う。
      - name: Toolchain
        shell: cmd
        run: chcp 65001 && build\Release\mosac.exe toolchain
      # vcvarsall の set は cmd /u の UTF-16LE で読む。日本語のディレクトリを TEMP にしても vcvarsall の環境が取れ
      # （取れなければ素の PATH に cl が無く toolchain が 1 で終わる）、その環境で作った実行ファイルが動くこと。
      - name: Toolchain with a non-ASCII TEMP
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'テスト'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:TEMP = $dir
          $env:TMP = $dir
          $env:MOSA_WERROR = '1'
          & build\Release\mosac.exe toolchain
          if ($LASTEXITCODE -ne 0) { throw "mosac toolchain failed with a non-ASCII TEMP" }
          & build\Release\mosac.exe build tests\mosac\hello.pl -o hello-temp
          if ($LASTEXITCODE -ne 0) { throw "mosac build failed with a non-ASCII TEMP" }
          & .\hello-temp.exe
          if ($LASTEXITCODE -ne 0) { throw "hello-temp.exe failed" }
      - name: Test
        run: ctest --preset windows-msvc -LE diff
      # mosatest --diff の日本語の文面を UTF-8 のまま取るため、コードページを 65001 にしてから流す。
      - name: Differential tests
        shell: cmd
        run: chcp 65001 && ctest --preset windows-msvc -L diff -V --no-tests=error
      # Visual Studio は構成名のディレクトリへ出す。Ninja の 3 ジョブは ./build/mosatest。
      - name: Conformance suite
        shell: bash
        run: build/Release/mosatest.exe --suite tests/conformance
      - name: Build standalone hello
        shell: cmd
        env:
          MOSA_WERROR: 1
        run: chcp 65001 && build\Release\mosac.exe build tests\mosac\hello.pl -o hello
      - uses: actions/upload-artifact@v4
        with:
          name: hello-windows
          path: hello.exe
          if-no-files-found: error
      - name: Write summary
        shell: bash
        run: |
          grep -m 1 '^合格率:' docs/conformance.md >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/.*"message":"\([^"]*\)".*/mosatest --diff: \1/p' docs/agreement.json | head -n 1 >> "$GITHUB_STEP_SUMMARY"

  # 単独の実行ファイル（持ち主の決定 3）。素の ubuntu:24.04 には libmosa も lib/*.pl も無い。成果物は実行権限を失うので付け直す。
  hello-linux:
    needs: [linux-gcc, linux-clang]
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hello-linux-*
      - name: Run in a bare container
        shell: bash
        run: |
          for dir in hello-linux-gcc hello-linux-clang; do
            chmod +x "$dir/hello"
            ldd "$dir/hello" || true
            out=$("$dir/hello")
            echo "$dir: $out"
            test "$out" = "こんにちは"
          done

  # macOS の libc++ は OS の一部で静的にできないので、依存が /usr/lib/ と /System/ の物だけであることを見る。
  hello-macos:
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello-macos
      - name: Check dependencies and run
        shell: bash
        run: |
          chmod +x hello
          otool -L hello
          bad=$(otool -L hello | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/)' || true)
          if [ -n "$bad" ]; then
            echo "non-OS libraries: $bad"
            exit 1
          fi
          out=$(./hello)
          echo "$out"
          test "$out" = "こんにちは"

  # /MT で作るので、dumpbin /dependents に出るのは OS の DLL だけであること（VCRUNTIME や MSVCP があれば単独でない）。
  hello-windows:
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello-windows
      - name: Check dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe') | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $lines = & $dumpbin /dependents hello.exe
          $lines
          $dlls = @()
          foreach ($line in $lines) {
            if ($line -match '^\s+(\S+\.dll)\s*$') { $dlls += $Matches[1].ToLowerInvariant() }
          }
          if ($dlls.Count -eq 0) { throw "no dependents parsed" }
          $allowed = @('kernel32.dll', 'advapi32.dll', 'shell32.dll', 'user32.dll', 'ole32.dll', 'oleaut32.dll', 'ntdll.dll', 'bcrypt.dll', 'ws2_32.dll')
          $bad = @($dlls | Where-Object { $allowed -notcontains $_ })
          if ($bad.Count -gt 0) { throw "non-OS DLLs: $($bad -join ', ')" }
          "dependents: $($dlls -join ', ')"
      - name: Run
        shell: bash
        run: |
          out=$(./hello.exe | tr -d '\r')
          echo "$out"
          test "$out" = "こんにちは"
