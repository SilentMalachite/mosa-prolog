name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 利用者に渡すパッケージを 3 OS で作る（リリース 0.1.0 Task 10）。ci.yml と同じ準備でビルドと ctest -LE diff を通し、
# cmake/package.cmake で書庫にしてから、空白と日本語を含む $RUNNER_TEMP/展開 先/ に展開した木で mosatest --manual を流す。
# ビルド木で通っても、install に入れ忘れた物や、mosa と mosac が自分の場所から lib を探す道の誤りは、読者と同じ形に
# 展開した木でしか出ないため。依存の確かめも、ビルド木ではなく渡す物そのもので行う。
# タグ v* では 3 つの書庫を下書きの Release に付ける。公開すると通知が飛び latest が変わるので、持ち主が中身を見てから手で行う。
# workflow_dispatch はタグを打つ前に 3 OS で試すためのもので、書庫を成果物に上げるだけで Release は作らない。
# 3 つのジョブで同じ手順（版の確かめ、書庫を作る、展開する）は bash にそろえ、Windows でも Git Bash で流す。
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 対応する macOS は 14 以降（マニュアルと CHANGELOG）。既定ではランナーの macOS の版が minos になり、14 では起動しない。
      - name: Configure
        run: cmake --preset macos-clang -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build
        run: cmake --build --preset macos-clang
      # 版が食い違えば書庫の名前（CMakeCache.txt の版）がタグと合わないので、時間のかかる ctest より前に止める。
      # workflow_dispatch では比べるタグが無い。
      - name: Check the tag against mosa --version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash .github/scripts/check_tag_version.sh build/mosa
      - name: Test
        run: ctest --preset macos-clang -LE diff
      # package.cmake の最後の行が書庫のパス。後の段と upload-artifact は MOSA_ARCHIVE で受け取る。
      # Windows の RUNNER_TEMP は \ 区切りなので、basename と、GITHUB_ENV を通して pwsh に渡すパスのために / にそろえる。
      - name: Package
        shell: bash
        run: |
          out="${RUNNER_TEMP//\\//}/package"
          printed=$(cmake -DBUILD_DIR=build -DCONFIG=Release "-DOUT=$out" -P cmake/package.cmake)
          printf '%s\n' "$printed"
          archive=$(printf '%s\n' "$printed" | tail -n 1 | tr -d '\r')
          if [ ! -f "$archive" ]; then
            echo "the last line of package.cmake is not an archive: $archive"
            exit 1
          fi
          echo "MOSA_ARCHIVE=$archive" >> "$GITHUB_ENV"
      # 読者は空白と日本語を含む場所にも展開する。書庫の中はパッケージと同じ名前のフォルダ 1 つ（第 2 章が読者に
      # そう書く）。cmake -E tar は .tar.gz も .zip も展開するので、3 OS で同じ手順にする。
      - name: Unpack
        shell: bash
        run: |
          dest="${RUNNER_TEMP//\\//}/展開 先"
          rm -rf "$dest"
          mkdir -p "$dest"
          name=$(basename "$MOSA_ARCHIVE")
          name=${name%.tar.gz}
          name=${name%.zip}
          (cd "$dest" && cmake -E tar xf "$MOSA_ARCHIVE")
          top=$(ls -A "$dest")
          if [ "$top" != "$name" ]; then
            echo "the archive must hold one folder $name, not: $top"
            exit 1
          fi
          echo "MOSA_PKG=$dest/$name" >> "$GITHUB_ENV"
      # 第 13 章は mosac build で例をコンパイルするので、mosac の既定の探索でランナーのコンパイラを使う（macOS は clang++）。
      # MOSA_LIB を外すのは、展開した木の mosa が自分の場所から bin/lib を見つけることを確かめるため。MOSA_WERROR=1 は
      # package_layout と同じく、生成した C++ が警告なしでコンパイルできることを見る。mosatest は例が 1 つも無ければ
      # 2 で終わるので、終了コードで足りる。
      - name: Manual in the unpacked tree
        shell: bash
        env:
          MOSA_WERROR: 1
        run: |
          unset MOSA_LIB
          work="${RUNNER_TEMP//\\//}/manual-work"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$MOSA_PKG"
          bin/mosatest --manual docs/manual --all-tables --work "$work"
      # macOS の libc++ は OS の一部で静的にできないので、依存が /usr/lib/ と /System/ の物だけであることを見る（ci.yml の
      # hello-macos と同じ）。minos は、Configure で決めた 14.0 が渡す実行ファイルに入ったことを見る。
      - name: Check dependencies and the minimum macOS
        shell: bash
        run: |
          cd "$MOSA_PKG"
          otool -L bin/mosa
          bad=$(otool -L bin/mosa | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/)' || true)
          if [ -n "$bad" ]; then
            echo "non-OS libraries: $bad"
            exit 1
          fi
          build=$(vtool -show-build bin/mosa)
          printf '%s\n' "$build"
          if ! printf '%s\n' "$build" | grep -E '^[[:space:]]*minos 14\.0$' > /dev/null; then
            echo "bin/mosa is not built for macOS 14.0"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: ${{ env.MOSA_ARCHIVE }}
          if-no-files-found: error

  # Linux のパッケージの実行時ライブラリは g++ の物だけにする（clang++ の読者には第 13 章が --runtime-source を書く）。
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build cmake
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      # 版が食い違えば書庫の名前（CMakeCache.txt の版）がタグと合わないので、時間のかかる ctest より前に止める。
      - name: Check the tag against mosa --version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash .github/scripts/check_tag_version.sh build/mosa
      - name: Test
        run: ctest --preset linux-gcc -LE diff
      # 書庫を作る、展開する理由は macos ジョブの同じ段に書いた。
      - name: Package
        shell: bash
        run: |
          out="${RUNNER_TEMP//\\//}/package"
          printed=$(cmake -DBUILD_DIR=build -DCONFIG=Release "-DOUT=$out" -P cmake/package.cmake)
          printf '%s\n' "$printed"
          archive=$(printf '%s\n' "$printed" | tail -n 1 | tr -d '\r')
          if [ ! -f "$archive" ]; then
            echo "the last line of package.cmake is not an archive: $archive"
            exit 1
          fi
          echo "MOSA_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Unpack
        shell: bash
        run: |
          dest="${RUNNER_TEMP//\\//}/展開 先"
          rm -rf "$dest"
          mkdir -p "$dest"
          name=$(basename "$MOSA_ARCHIVE")
          name=${name%.tar.gz}
          name=${name%.zip}
          (cd "$dest" && cmake -E tar xf "$MOSA_ARCHIVE")
          top=$(ls -A "$dest")
          if [ "$top" != "$name" ]; then
            echo "the archive must hold one folder $name, not: $top"
            exit 1
          fi
          echo "MOSA_PKG=$dest/$name" >> "$GITHUB_ENV"
      # mosac の既定の探索は Linux では g++ を先に見るので、同梱の g++ の実行時ライブラリで第 13 章を通す。
      # MOSA_LIB と MOSA_WERROR の理由は macos ジョブの同じ段に書いた。
      - name: Manual in the unpacked tree
        shell: bash
        env:
          MOSA_WERROR: 1
        run: |
          unset MOSA_LIB
          work="${RUNNER_TEMP//\\//}/manual-work"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$MOSA_PKG"
          bin/mosatest --manual docs/manual --all-tables --work "$work"
      # 素の ubuntu:24.04 には g++ も libmosa も無い（ci.yml の hello-linux と同じ）。展開した bin/mosa が、ランナーに
      # だけある物を要らずに起動することを見る。ldd の一覧は落ちたときに読むために出す。
      - name: Run in a bare container
        shell: bash
        run: |
          name=$(basename "$MOSA_PKG")
          version=${name#mosa-}
          version=${version%-linux-x86_64}
          out=$(docker run --rm -v "$MOSA_PKG:/mosa:ro" ubuntu:24.04 \
            sh -c 'ldd /mosa/bin/mosa >&2 || true; exec /mosa/bin/mosa --version')
          echo "$out"
          test "$out" = "mosa $version"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: ${{ env.MOSA_ARCHIVE }}
          if-no-files-found: error

  windows:
    # windows-latest は 2026-06 以降 Visual Studio 2026 である。SPEC 第2節の MSVC 2022 と Visual Studio 17 2022 ジェネレータがある windows-2022 を使う。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      # 版が食い違えば書庫の名前（CMakeCache.txt の版）がタグと合わないので、時間のかかる ctest より前に止める。
      # Visual Studio は構成名のディレクトリへ出す。
      - name: Check the tag against mosa --version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash .github/scripts/check_tag_version.sh build/Release/mosa.exe
      - name: Test
        run: ctest --preset windows-msvc -LE diff
      # 書庫を作る、展開する理由は macos ジョブの同じ段に書いた。
      - name: Package
        shell: bash
        run: |
          out="${RUNNER_TEMP//\\//}/package"
          printed=$(cmake -DBUILD_DIR=build -DCONFIG=Release "-DOUT=$out" -P cmake/package.cmake)
          printf '%s\n' "$printed"
          archive=$(printf '%s\n' "$printed" | tail -n 1 | tr -d '\r')
          if [ ! -f "$archive" ]; then
            echo "the last line of package.cmake is not an archive: $archive"
            exit 1
          fi
          echo "MOSA_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Unpack
        shell: bash
        run: |
          dest="${RUNNER_TEMP//\\//}/展開 先"
          rm -rf "$dest"
          mkdir -p "$dest"
          name=$(basename "$MOSA_ARCHIVE")
          name=${name%.tar.gz}
          name=${name%.zip}
          (cd "$dest" && cmake -E tar xf "$MOSA_ARCHIVE")
          top=$(ls -A "$dest")
          if [ "$top" != "$name" ]; then
            echo "the archive must hold one folder $name, not: $top"
            exit 1
          fi
          echo "MOSA_PKG=$dest/$name" >> "$GITHUB_ENV"
      # mosac は既定の探索（vswhere → vcvarsall）で cl.exe を見つける。ci.yml の windows ジョブの「Toolchain with a
      # non-ASCII TEMP」と同じく pwsh から呼び、開発者用のコマンドプロンプトを用意しない（読者もそうする）。
      # MOSA_LIB と MOSA_WERROR の理由は macos ジョブの同じ段に書いた。
      - name: Manual in the unpacked tree
        shell: pwsh
        env:
          MOSA_WERROR: 1
        run: |
          Remove-Item Env:MOSA_LIB -ErrorAction Ignore
          $work = Join-Path $env:RUNNER_TEMP 'manual-work'
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location -LiteralPath $env:MOSA_PKG
          & bin\mosatest.exe --manual docs/manual --all-tables --work $work
          if ($LASTEXITCODE -ne 0) { throw "mosatest --manual failed with $LASTEXITCODE" }
      # /MT で作るので、dumpbin /dependents に出るのは OS の DLL だけであること（VCRUNTIME や MSVCP があれば単独でない）。
      # 許す DLL の一覧は ci.yml の hello-windows と同じ。
      - name: Check dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:MOSA_PKG
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe') | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $lines = & $dumpbin /dependents bin\mosa.exe
          $lines
          $dlls = @()
          foreach ($line in $lines) {
            if ($line -match '^\s+(\S+\.dll)\s*$') { $dlls += $Matches[1].ToLowerInvariant() }
          }
          if ($dlls.Count -eq 0) { throw "no dependents parsed" }
          $allowed = @('kernel32.dll', 'advapi32.dll', 'shell32.dll', 'user32.dll', 'ole32.dll', 'oleaut32.dll', 'ntdll.dll', 'bcrypt.dll', 'ws2_32.dll')
          $bad = @($dlls | Where-Object { $allowed -notcontains $_ })
          if ($bad.Count -gt 0) { throw "non-OS DLLs: $($bad -join ', ')" }
          "dependents: $($dlls -join ', ')"
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: ${{ env.MOSA_ARCHIVE }}
          if-no-files-found: error

  # タグを push したときだけ、3 つのジョブがすべて通った書庫を下書きの Release に付ける。workflow_dispatch をタグの
  # ref で流しても Release は作らない。本文は CHANGELOG.md の「## <版>」の節（次の「## 」の見出しまで）で、見出しの
  # 行は Release の題名と重なるので入れない。節が空でも（Task 11 の前の雛形）下書きは作れる。
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Release notes
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! awk -v version="$version" '
              $1 == "##" && $2 == version { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      # 名前を 3 つとも挙げ、どれかが欠けていれば Release を作る前に止める。
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          archives=("packages/mosa-$version-macos-arm64.tar.gz" "packages/mosa-$version-linux-x86_64.tar.gz" "packages/mosa-$version-windows-x86_64.zip")
          for archive in "${archives[@]}"; do
            if [ ! -f "$archive" ]; then
              echo "missing $archive"
              ls -l packages
              exit 1
            fi
          done
          gh release create "$GITHUB_REF_NAME" --draft --title "Mosa Prolog $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${archives[@]}"
